# Senhas e tokens de desenvolvimento (docker-compose, .env.example e CI) são fictícios e intencionais.
[extend]
useDefault = true

[allowlist]
description = "Credenciais fictícias de desenvolvimento e de testes"
paths = ['''docker-compose\.yml''', '''\.env\.example''', '''\.github/workflows/ci\.yml''', '''docker/seaweedfs/s3\.json''', '''src/config/env\.schema\.spec\.ts''']
# Alfabeto público da senha provisória (feature 005), não é segredo: só esse texto exato, não o arquivo.
regexes = ['''23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz''']

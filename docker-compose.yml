# Ambiente de DESENVOLVIMENTO. Senhas e tokens abaixo são só para uso local.
#
#   docker compose up -d                      -> infraestrutura (Postgres, Vault, Redis, S3, Mailpit)
#   docker compose --profile av up -d         -> + ClamAV (pesado: ~1 GB de RAM e download de assinaturas)
#   docker compose --profile app up -d --build -> + migrations e API em container
name: canal-denuncias

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: canal_denuncias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_superuser_pw
      APP_MIGRATOR_PASSWORD: dev_migrator_pw
      APP_RUNTIME_PASSWORD: dev_runtime_pw
      APP_AUDIT_MAINTENANCE_PASSWORD: dev_audit_maintenance_pw
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d canal_denuncias']
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:2.2
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
    cap_add: [IPC_LOCK]
    ports: ['8200:8200']
    healthcheck:
      test: ['CMD', 'vault', 'status', '-address=http://127.0.0.1:8200']
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:2.2
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./docker/vault/init-transit.sh:/init-transit.sh:ro
      - ./docker/vault/api-dev-policy.hcl:/api-dev-policy.hcl:ro
      - ./docker/vault/maintenance-dev-policy.hcl:/maintenance-dev-policy.hcl:ro
    entrypoint: ['/bin/sh', '/init-transit.sh']
    restart: 'no'

  redis:
    image: redis:8.8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatível para os anexos (substitui o MinIO, que deixou de publicar imagens no Docker Hub).
  s3:
    image: chrislusf/seaweedfs:4.55
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333']
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web

  clamav:
    image: clamav/clamav:1.5-debian13-slim
    profiles: [av]
    ports: ['3310:3310']
    volumes:
      - clamdb:/var/lib/clamav

  migrate:
    build: { context: ., target: runtime }
    profiles: [app]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://app_migrator:dev_migrator_pw@postgres:5432/canal_denuncias
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/database/data-source.js']
    restart: 'no'

  api:
    build: { context: ., target: runtime }
    profiles: [app]
    depends_on:
      migrate: { condition: service_completed_successfully }
      vault-init: { condition: service_completed_successfully }
    environment: &api-env
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://app_runtime:dev_runtime_pw@postgres:5432/canal_denuncias
      CORS_ORIGINS: http://localhost:4200,http://localhost:4300
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: dev-api-role-id
      VAULT_SECRET_ID: dev-api-secret-id
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: attachments
      S3_ACCESS_KEY: dev-access-key
      S3_SECRET_KEY: dev-secret-key
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: canal-denuncias@localhost
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECRET: dev-session-secret-com-pelo-menos-32-bytes
      REPORTER_TOKEN_SECRET: dev-reporter-token-secret-com-32-bytes-ou-mais
      AUTH_HMAC_SECRET: dev-auth-hmac-secret-com-pelo-menos-32-bytes
    ports: ['3000:3000']

  # Exemplo da manutenção diária da trilha (D50): cria as partições à frente e expurga as que passaram de 5 anos.
  # Em produção, rode este comando uma vez por dia por agendador do sistema (docs/deploy/audit/README.md).
  audit-maintenance:
    build: { context: ., target: runtime }
    profiles: [app]
    depends_on:
      migrate: { condition: service_completed_successfully }
      vault-init: { condition: service_completed_successfully }
    environment:
      <<: *api-env
      DATABASE_AUDIT_MAINTENANCE_URL: postgres://app_audit_maintenance:dev_audit_maintenance_pw@postgres:5432/canal_denuncias
    command: ['node', 'dist/cli.js', 'audit-maintenance']
    restart: 'no'

volumes:
  pgdata:
  s3data:
  clamdb:

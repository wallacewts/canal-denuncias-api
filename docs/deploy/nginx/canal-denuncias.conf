# Configuração de referência do proxy reverso da API (TRV-12). Contexto: http (ex.: /etc/nginx/conf.d/).
# O anonimato do denunciante também depende daqui: veja docs/deploy/proxy.md antes de alterar qualquer diretiva.

upstream canal_api {
    # API NestJS na rede interna. Nunca exponha a porta 3000 diretamente.
    server api:3000;
    keepalive 16;
}

# Formato do access log da área administrativa: sem query string, sem user-agent, sem referer.
log_format canal_admin '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server_tokens off;

# HTTP só redireciona para HTTPS, sem registrar nada (o redirecionamento também veria IPs de denunciantes).
server {
    listen 80;
    listen [::]:80;
    access_log off;
    error_log /dev/stderr crit;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Igual a MAX_ATTACHMENT_BYTES da API (10485760 bytes).
    client_max_body_size 10m;

    # Padrão: nenhum log. Cada location libera explicitamente o que pode registrar.
    access_log off;
    error_log /dev/stderr crit;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Área do denunciante: nenhum log e nenhum dado de origem chega à API.
    location /api/public/ {
        access_log off;
        # Erros de cliente (ex.: 413) entram no error log com "client: <IP>": aqui só o que for crítico.
        error_log /dev/stderr crit;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";
        proxy_pass http://canal_api;
    }

    # Área da equipe: access log com IP (auditoria de ações internas).
    location /api/admin/ {
        access_log /dev/stdout canal_admin;
        error_log /dev/stderr warn;

        # Substitui (não acrescenta) para que o cliente não forje IPs anteriores na cadeia.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://canal_api;
    }

    location = /health {
        access_log off;
        proxy_pass http://canal_api;
    }

    location = /ready {
        access_log off;
        proxy_pass http://canal_api;
    }

    # Nada além da API passa por este proxy (portal e backoffice têm seus próprios servidores).
    location / {
        return 404;
    }
}
